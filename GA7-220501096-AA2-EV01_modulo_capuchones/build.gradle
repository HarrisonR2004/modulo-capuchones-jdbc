plugins {
    id 'java'
    id 'application'
}

group = 'co.agroline'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    // driver JDBC de SQLite
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'co.agroline.capuchones.Main'
}

run {
    standardInput = System.in
}
